plugins {
    id 'java'
}

def protobufVersion = '3.14.0'

dependencies {
    implementation core
    implementation project(':report-model')
    implementation "com.google.protobuf:protobuf-java:$protobufVersion"
}

def appReact = project(':report-ng:app-react')
def buildReportRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName == 'buildReport' || taskName == ':report-ng:buildReport'
}

tasks.named('processResources') {
    if (buildReportRequested) {
        dependsOn(appReact.tasks.named('buildReport'))
    }

    from(appReact.layout.projectDirectory.dir('dist')) {
        into 'report-ng'
        exclude 'model/**'
    }
}

tasks.register('buildReport') {
    group = 'build'
    description = 'Builds and packages the report-ng frontend into the report-ng artifact.'
    dependsOn(tasks.named('jar'))
}
