plugins {
    id 'java'
}

def protobufVersion = '3.14.0'

dependencies {
    implementation core
    implementation project(':report-model')
    implementation "com.google.protobuf:protobuf-java:$protobufVersion"
}

def appReact = project(':report-ng:app-react')
def appReactBuildReportTaskPath = ':report-ng:app-react:buildReport'
def processResourcesTask = tasks.named('processResources')
def reportResourcesDirectory = layout.projectDirectory.dir('src/main/resources/report-ng')

def syncBuiltReportResourcesTask = tasks.register('syncBuiltReportResources', Sync) {
    dependsOn(appReactBuildReportTaskPath)
    from(appReact.layout.projectDirectory.dir('dist')) {
        exclude 'model/**'
    }
    into(reportResourcesDirectory)
}

processResourcesTask.configure {
    mustRunAfter(syncBuiltReportResourcesTask)
}

tasks.register('buildReport') {
    group = 'build'
    description = 'Builds the report frontend and refreshes report-ng resources.'
    dependsOn(syncBuiltReportResourcesTask, processResourcesTask)
}
